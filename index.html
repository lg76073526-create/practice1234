<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#efe8da">
  <title>알바영어</title>
  <link rel="stylesheet" href="css/style.css?v=11">
  <script>
    try {
      var saved = JSON.parse(localStorage.getItem("alba-english") || "{}");
      if (saved.theme === "night") document.documentElement.setAttribute("data-theme", "night");
    } catch (err) {}
  </script>
</head>
<body>
  <div class="app-shell">
    <a class="skip" href="#app">내용으로</a>
    <header class="top">
      <a class="back" id="back" href="#/" hidden>뒤로</a>
      <a class="logo" href="#/">알바영어</a>
      <p class="crumb" id="crumb"></p>
      <button type="button" class="theme" id="theme" aria-pressed="false">야간</button>
    </header>
    <main id="app" tabindex="-1"></main>
    <nav class="dock" id="dock" aria-label="주요 메뉴">
      <a href="#/" data-dock="home">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11.2 12 4l8 7.2V20a1 1 0 0 1-1 1h-5.2v-6.2H10.2V21H5a1 1 0 0 1-1-1z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
        홈
      </a>
      <a href="#/jobs" data-dock="jobs">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="7" rx="1.6" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.6" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.6" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.6" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
        업종
      </a>
      <a href="#/jobs" id="dock-mine" data-dock="mine">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 7.5V6.2A2.2 2.2 0 0 1 10.2 4h3.6A2.2 2.2 0 0 1 16 6.2v1.3" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="4" y="7.5" width="16" height="12.5" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M4 12.5h16" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
        내 알바
      </a>
      <a href="#/menu" data-dock="menu">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14M5 12h14M5 17h14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        메뉴
      </a>
    </nav>
    <noscript>
      <p class="wrap noscript">문장을 고르고 연습하려면 자바스크립트가 필요합니다.</p>
    </noscript>
  </div>
  <script src="js/data.js?v=6"></script>
  <script src="js/app.js?v=7"></script>
</body>
</html>
